<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BlitzIQ — Play Diagram Library</title>
  <style>
    :root {
      --navy:#0a1628; --navy2:#112240; --navy3:#1a3256; --navyc:#0f1e35;
      --gold:#f0a500; --goldd:#c88a00; --white:#ffffff;
      --gray:#7a8fa8; --grayl:#afc2d4;
      --green:#22c55e; --blue:#60a5fa; --amber:#f59e0b; --red:#ef4444;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;max-width:640px;margin:0 auto}

    /* HEADER */
    .hdr{background:var(--navy2);border-bottom:2px solid var(--gold);padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
    .logo{font-size:26px;font-weight:900;letter-spacing:3px;color:var(--gold);line-height:1}
    .logo span{color:var(--white)}
    .hdr-sub{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-top:2px}
    .hdr-txt{flex:1}

    /* SCREENS */
    .screen{display:none;padding:16px}
    .screen.active{display:block;animation:slideIn .18s ease}
    @keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

    /* TYPE */
    .sc-title{font-size:22px;font-weight:800;margin-bottom:3px;margin-top:4px}
    .sc-sub{font-size:13px;color:var(--gray);margin-bottom:16px}
    .sec-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin:4px 0 12px}

    /* CARDS */
    .card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:14px;cursor:pointer;position:relative;transition:border-color .15s,transform .1s}
    .card:active{transform:scale(.985);border-color:var(--gold)}
    .card-name-sm{font-size:18px;font-weight:800;margin-bottom:12px;padding-right:64px}
    .card-note{font-size:13px;color:var(--grayl);line-height:1.55;font-style:italic;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
    .card-meta{font-size:12px;color:var(--gray);margin-top:4px}

    /* DELETE / EDIT BTN */
    .del-btn{position:absolute;top:14px;right:14px;width:30px;height:30px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:7px;color:var(--red);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
    .del-btn:active{background:rgba(239,68,68,.3)}
    .edit-btn{position:absolute;top:14px;right:50px;width:30px;height:30px;background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.25);border-radius:7px;color:var(--gold);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
    .edit-btn:active{background:rgba(240,165,0,.3)}

    /* ACTION ROW */
    .action-row{display:flex;gap:10px;margin-bottom:20px}
    .act-pri{flex:1;padding:15px 10px;background:var(--gold);border:none;border-radius:12px;color:var(--navy);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
    .act-pri:active{background:var(--goldd)}
    .act-sec{flex:1;padding:15px 10px;background:rgba(240,165,0,.1);border:1.5px solid rgba(240,165,0,.4);border-radius:12px;color:var(--gold);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
    .act-sec:active{background:rgba(240,165,0,.2)}

    /* EMPTY */
    .empty{text-align:center;padding:44px 24px;color:var(--gray)}
    .empty-icon{font-size:44px;margin-bottom:12px}
    .empty-txt{font-size:14px;line-height:1.6}

    /* MODAL */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
    .modal-ov.open{opacity:1;pointer-events:all}
    .modal-sheet{width:100%;max-width:640px;margin:0 auto;background:var(--navy2);border-radius:20px 20px 0 0;border-top:2px solid var(--gold);max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;-webkit-overflow-scrolling:touch}
    .modal-ov.open .modal-sheet{transform:translateY(0)}
    .modal-handle{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:12px auto 0}
    .modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
    .modal-title{font-size:18px;font-weight:800}
    .modal-x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:var(--grayl);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .modal-body{padding:16px 20px}
    .modal-foot{padding:12px 20px 28px;display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.07)}

    /* FIELDS */
    .fld{margin-bottom:18px}
    .fld-lbl{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);font-weight:700;margin-bottom:8px}
    .fld-in{width:100%;background:var(--navy);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 16px;color:var(--white);font-size:16px;outline:none;transition:border-color .15s;-webkit-appearance:none;font-family:inherit}
    .fld-in:focus{border-color:var(--gold)}
    .fld-in.err{border-color:var(--red)}
    .fld-ta{width:100%;background:var(--navy);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 16px;color:var(--white);font-size:15px;outline:none;resize:none;height:86px;line-height:1.5;font-family:inherit;transition:border-color .15s}
    .fld-ta:focus{border-color:var(--gold)}

    /* CHIPS */
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .chip{padding:7px 12px;background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:var(--grayl);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
    .chip:active{background:rgba(240,165,0,.2);border-color:var(--gold);color:var(--gold)}

    /* BUTTONS */
    .btn-cancel{flex:1;padding:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--grayl);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
    .btn-save{flex:2;padding:16px;background:var(--gold);border:none;border-radius:12px;color:var(--navy);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
    .btn-save:active{background:var(--goldd)}

    /* LOADING */
    .load-ov{position:fixed;inset:0;background:rgba(10,22,40,.88);z-index:800;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;opacity:0;pointer-events:none;transition:opacity .2s}
    .load-ov.open{opacity:1;pointer-events:all}
    .spinner{width:44px;height:44px;border:3px solid rgba(240,165,0,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .load-txt{font-size:15px;color:var(--grayl);font-weight:600}

    /* PLAY CANVAS */
    .canvas-ov{position:fixed;inset:0;background:var(--navy);z-index:900;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .18s;overflow:hidden}
    .canvas-ov.open{opacity:1;pointer-events:all}
    .canvas-hdr{background:var(--navy2);border-bottom:2px solid var(--gold);padding:5px 12px;height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
    @media (orientation:landscape) and (max-height:540px){.canvas-hdr{padding:3px 10px;height:40px}}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(34,197,94,.92);color:#fff;font-size:12px;font-weight:700;padding:8px 18px;border-radius:20px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s}
    .toast.show{opacity:1}
    /* ── PRINT ── */
    #printPage{display:none}
    @media print{
      body>*:not(#printPage){display:none!important}
      #printPage{display:block!important;margin:0;padding:0}
      @page{margin:.45in}
    }
    .pp-h{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:10pt;line-height:1.4}
    .pp-logo{font-size:22pt;font-weight:900;letter-spacing:3px;color:#111}
    .pp-logo span{color:#666}
    .pp-form-name{font-size:17pt;font-weight:900}
    .pp-divider{border:none;border-top:2.5px solid #111;margin:8px 0}
    .pp-lbl{font-size:7pt;letter-spacing:1.5px;text-transform:uppercase;color:#777;font-weight:700;margin-bottom:3px}
    .pp-blitz{font-size:10pt;font-weight:700;margin-bottom:10px}
    .pp-gap-tbl{width:100%;border-collapse:collapse;font-size:8pt;margin-bottom:8px}
    .pp-gap-tbl td{padding:2px 5px 2px 0;vertical-align:top}
    .pp-gap-val{font-weight:800;color:#111;white-space:nowrap}
    .pp-gap-note{color:#666}
    .pp-reason{font-size:8.5pt;line-height:1.55;color:#333;margin-bottom:8px}
    .pp-notes-box{border:1px solid #bbb;border-radius:3px;height:55px;margin-top:4px}
    .pp-footer{font-size:7pt;color:#aaa;text-align:center;margin-top:10px;border-top:1px solid #ddd;padding-top:6px}
    .canvas-hdr-title{font-size:15px;font-weight:800;color:var(--white)}
    .canvas-hdr-sub{font-size:10px;color:var(--gray);letter-spacing:.5px;margin-top:1px}
    .canvas-btns{display:flex;gap:8px;flex-shrink:0}
    .cbtn-clear{padding:7px 12px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
    .cbtn-save{padding:7px 16px;background:var(--gold);border:none;border-radius:8px;color:var(--navy);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
    .cbtn-save:active{background:var(--goldd)}
    .cbtn-close{padding:7px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:var(--grayl);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
    .canvas-toolbar{background:var(--navyc);border-top:1px solid rgba(255,255,255,.1);padding:6px 12px;min-height:50px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
    .toolbar-body{transition:max-height .25s ease,opacity .25s ease;overflow-y:auto;max-height:140px;opacity:1}
    .toolbar-body.collapsed{max-height:0;opacity:0}
    .collapse-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:7px;color:var(--grayl);font-size:13px;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .cv-def-call{background:rgba(240,165,0,.1);border-top:1px solid rgba(240,165,0,.2);padding:8px 14px;flex-shrink:0;display:none}
    .cv-def-call.show{display:block}
    .cv-def-cov{font-size:15px;font-weight:900;color:var(--gold);line-height:1.1}
    .cv-def-blitz{font-size:12px;font-weight:700;color:var(--white);margin-top:2px}
    .mode-row{display:flex;gap:8px}
    .mode-btn{flex:1;padding:8px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--grayl);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
    .mode-btn.active{background:rgba(240,165,0,.18);border-color:var(--gold);color:var(--gold)}
    .player-panel{display:flex;flex-direction:column;gap:5px}
    .player-panel-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .player-panel-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);font-weight:700;width:32px;flex-shrink:0}
    .pbtn{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.5);color:var(--white);font-size:9px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;background:transparent;line-height:1}
    .pbtn.off{background:rgba(34,197,94,.85);color:#ffffff;border-color:rgba(34,197,94,.9)}
    .cv-del-player{position:absolute;z-index:950;background:var(--red);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:800;padding:6px 14px;cursor:pointer;pointer-events:all;font-family:inherit;box-shadow:0 2px 10px rgba(0,0,0,.5);transform:translateX(-50%);white-space:nowrap}
    .pbtn.center{border-radius:5px}
    .pbtn.selected{box-shadow:0 0 0 3px #f0a500;transform:scale(1.1)}
    .pbtn:active{transform:scale(.95)}
    .preset-section{display:flex;flex-direction:column;gap:5px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px}
    .preset-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .preset-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);font-weight:700;width:28px;flex-shrink:0}
    .pbtn-preset{padding:6px 11px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;color:var(--grayl);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .12s;line-height:1}
    .pbtn-preset:active{background:rgba(240,165,0,.22);border-color:var(--gold);color:var(--gold);transform:scale(.95)}
    .draw-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .clr-btn{width:26px;height:26px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;flex-shrink:0;transition:border-color .12s,transform .12s}
    .clr-btn.active{border-color:var(--white);transform:scale(1.15)}
    .tool-sep{width:1px;height:22px;background:rgba(255,255,255,.1);flex-shrink:0}
    .ctool-btn{padding:5px 10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:7px;color:var(--grayl);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s}
    .ctool-btn.active{background:rgba(240,165,0,.18);border-color:var(--gold);color:var(--gold)}
    .cw-btn{padding:4px 9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:var(--gray);font-size:13px;cursor:pointer;font-family:inherit;line-height:1;transition:all .12s}
    .cw-btn.active{border-color:var(--gold);color:var(--gold)}
    .canvas-wrap{flex:1;position:relative;overflow:hidden}
    #playCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
    .cv-assign{background:var(--navyc);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;display:none}
    .cv-assign.show{display:block}
    .cv-assign-hdr{padding:5px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
    .cv-assign-hdr:active{background:rgba(255,255,255,.03)}
    #cvAssignBody{padding:4px 12px 6px;max-height:110px;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #cvAssignBody.collapsed{display:none}
    .ca-row{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin-bottom:5px}
    .ca-hdr{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;flex-shrink:0;padding-top:2px}
    .ca-hdr.rush{color:var(--red)}.ca-hdr.cov{color:var(--blue)}.ca-hdr.warn{color:var(--amber)}
    .ca-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
    .ca-badge.rush{background:rgba(239,68,68,.2);color:var(--red);border:1px solid rgba(239,68,68,.35)}
    .ca-badge.cov{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.3)}
    .ca-badge.man{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
    .ca-badge.high{background:rgba(240,165,0,.15);color:var(--gold);border:1px solid rgba(240,165,0,.4)}
    .ca-warn-box{font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;margin-top:3px;line-height:1.4}
    .ca-warn-thin{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
    .ca-warn-crit{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.4)}
    .ca-warn-c0{background:rgba(239,68,68,.2);color:var(--red);border:1px solid rgba(239,68,68,.5);font-size:12px}
    .ca-warn-info{background:rgba(240,165,0,.1);color:var(--gold);border:1px solid rgba(240,165,0,.3)}
    .ca-conflict{background:rgba(239,68,68,.18);color:var(--red);border:1px solid var(--red);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;margin-top:4px}
    .ca-warn-gap{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.4)}
    .play-thumb{width:100%;display:block;border-radius:8px 8px 0 0}
    .tmpl-card{background:var(--navy2);border:1px solid rgba(255,255,255,.06);border-radius:14px;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s,transform .1s}
    .tmpl-card:active{transform:scale(.985);border-color:var(--gold)}
    .tmpl-info{padding:14px 18px}
    .custom-preset-wrap{display:inline-flex;align-items:center;gap:2px}
    .custom-preset-del{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:50%;width:16px;height:16px;color:var(--red);font-size:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:-6px;line-height:1;font-family:inherit;padding:0}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-txt">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="logo">BLITZ<span>IQ</span></div>
      <span style="background:var(--gold);color:var(--navy);font-size:9px;font-weight:900;letter-spacing:1.5px;padding:2px 7px;border-radius:10px;text-transform:uppercase">Beta</span>
    </div>
    <div class="hdr-sub">Play Diagram Library</div>
  </div>
  <button onclick="openFeedback()" style="margin-left:auto;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:var(--grayl);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px">&#128172; Feedback</button>
</div>

<!-- SCREEN 1 — TEMPLATE LIBRARY -->
<div class="screen active" id="screen1">
  <p class="sc-title">Play Library</p>
  <p class="sc-sub">Draw, save, and reuse formations, plays, and motions</p>
  <div class="action-row">
    <button class="act-pri" onclick="openNewTemplate()">+ New Template</button>
  </div>
  <div id="templateList"></div>
</div>

<!-- LOADING -->
<div class="load-ov" id="loadOv">
  <div class="spinner"></div>
  <div class="load-txt" id="loadTxt">Loading…</div>
</div>

<!-- PLAY CANVAS OVERLAY -->
<div class="canvas-ov" id="canvasOv">
  <div class="canvas-hdr">
    <div>
      <div class="canvas-hdr-title">&#9999; Draw Play</div>
      <div class="canvas-hdr-sub" id="canvasSubTitle">New Template</div>
    </div>
    <div class="canvas-btns">
      <button class="cbtn-clear" onclick="flipCanvas()" title="Mirror play left/right">&#8596; Flip</button>
      <button class="cbtn-clear" onclick="clearCanvas()">Clear</button>
      <button class="cbtn-save" onclick="saveCanvas()">Save</button>
      <button class="cbtn-close" onclick="printPlayCard()" title="Print play card">&#128438;</button>
      <button class="cbtn-save" onclick="sharePlayCard()" style="background:rgba(240,165,0,.18);border:1.5px solid rgba(240,165,0,.5);color:var(--gold)">&#11014; Share</button>
      <button class="cbtn-close" onclick="closeCanvas()">&#10005;</button>
    </div>
  </div>

  <div class="cv-def-call" id="cvDefCall">
    <div class="cv-def-cov" id="cvDefCov"></div>
    <div class="cv-def-blitz" id="cvDefBlitz"></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="playCanvas"></canvas>
  </div>
  <div class="canvas-toolbar">
    <div class="mode-row">
      <button class="mode-btn active" id="modePlaceBtn" onclick="setCanvasMode('place',this)">&#127952; Place Players</button>
      <button class="mode-btn" id="modeDrawBtn" onclick="setCanvasMode('draw',this)">&#9998; Draw Routes</button>
      <button class="collapse-btn" id="toolCollapseBtn" onclick="toggleCanvasTools()" title="Show/hide tools">&#8963;</button>
    </div>
    <div class="toolbar-body collapsed" id="toolbarBody">
    <div id="placePanel">
      <div class="preset-section">
        <div class="preset-row">
          <span class="preset-lbl">DEF</span>
          <button class="pbtn-preset" onclick="placePreset('4-3')">4-3</button>
          <button class="pbtn-preset" onclick="placePreset('3-4')">3-4</button>
          <button class="pbtn-preset" onclick="placePreset('3-3-5')">3-3-5 Stack</button>
        </div>
        <div class="preset-row">

<script>
// ── STORAGE ───────────────────────────────────────────────────────────────────
const SKEY = 'blitziq_templates_v1';
let DB = { templates: [] };

function loadDB() {
  try { const r = localStorage.getItem(SKEY); if (r) DB = JSON.parse(r); } catch(e) {}
  if(!DB.templates) DB.templates=[];
  if(!DB.customPresets) DB.customPresets=[];
  saveDB();
}
function saveDB() { localStorage.setItem(SKEY, JSON.stringify(DB)); }
function uid() { return Date.now() * 1000 + Math.floor(Math.random() * 999); }
function fillFld(id,val){ document.getElementById(id).value=val; }
function openModal(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
function openFeedback(){ window.open('https://forms.gle/Ty5E7rFWvYERbEJ98','_blank'); }
function showLoad(msg){ document.getElementById('loadTxt').textContent=msg||'Loading…'; document.getElementById('loadOv').classList.add('open'); }
function hideLoad(){ document.getElementById('loadOv').classList.remove('open'); }

// ── TEMPLATE LIBRARY ─────────────────────────────────────────────────────────
let cvEditingId = null;

function renderLibrary() {
  const el = document.getElementById('templateList');
  if (!DB.templates.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">&#9999;</div>
      <div class="empty-txt">No templates yet.<br>Tap <strong>+ New Template</strong> to draw your first formation.</div>
    </div>`;
    return;
  }
  el.innerHTML = DB.templates.map(t => {
    const date = t.createdAt ? new Date(t.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
    return `<div class="tmpl-card" onclick="openTemplate('${t.id}')">
      ${t.thumbnail ? `<img src="${t.thumbnail}" class="play-thumb" alt="${esc(t.name)}">` : ''}
      <div class="tmpl-info">
        <div class="card-name-sm">${esc(t.name)}</div>
        <button class="del-btn" onclick="deleteTemplate('${t.id}',event)" title="Delete">&#10005;</button>
        <button class="edit-btn" onclick="renameTemplate('${t.id}',event)" title="Rename">&#9998;</button>
        ${t.notes ? `<div class="card-note">${esc(t.notes)}</div>` : ''}
        ${date ? `<div class="card-meta">${date}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openNewTemplate() {
  cvEditingId = null;
  document.getElementById('canvasSubTitle').textContent = 'New Template';
  window._cvFormName = '';
  openCanvas();
}

function openTemplate(id) {
  cvEditingId = id;
  const t = DB.templates.find(t => t.id === id);
  document.getElementById('canvasSubTitle').textContent = t ? t.name : 'Edit Template';
  window._cvFormName = t ? t.name : '';
  openCanvas();
}

function deleteTemplate(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this template? This cannot be undone.')) return;
  DB.templates = DB.templates.filter(t => t.id !== id);
  saveDB();
  renderLibrary();
}

function renameTemplate(id, e) {
  e.stopPropagation();
  const t = DB.templates.find(t => t.id === id);
  if (!t) return;
  const name = prompt('Rename template:', t.name);
  if (name && name.trim()) { t.name = name.trim(); saveDB(); renderLibrary(); }
}

function confirmSaveTemplate() {
  const nameIn = document.getElementById('tmplNameIn');
  const name = nameIn.value.trim();
  if (!name) { nameIn.classList.add('err'); nameIn.focus(); return; }
  nameIn.classList.remove('err');
  const notes = document.getElementById('tmplNotesIn').value.trim();
  const pending = window._pendingSave || {};
  const t = {
    id: uid(),
    name,
    notes,
    cvPlayers: pending.cvPlayers || [],
    cvRoutes: pending.cvRoutes || null,
    cvPresetType: pending.cvPresetType || null,
    thumbnail: pending.thumbnail || null,
    createdAt: Date.now(),
  };
  DB.templates.unshift(t);
  saveDB();
  closeModal('mSaveTemplate');
  closeCanvas();
  renderLibrary();
  showToast('Template saved');
  window._pendingSave = null;
}

// ── ESCAPE HTML ───────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── CANVAS STATE ──────────────────────────────────────────────────────────────
let cvCtx=null, cvDrawing=false, cvColor='#ef4444', cvWidth=3, cvTool='pen', cvLX=0, cvLY=0;
let cvMode='place';
let cvPlayers=[];
let cvSelectedSymbol=null;
let cvSelectedPlayer=null;
let cvDragging=null;
let cvDragOffX=0, cvDragOffY=0;
let cvRouteCanvas=null;
let cvRouteUndoStack=[];
let cvPid=0;
let CV_R=10;

// ── FIELD DRAWING ─────────────────────────────────────────────────────────────
function drawField(ctx,w,h){
  ctx.fillStyle='#15391f';
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,0.30)';
  ctx.lineWidth=1;
  const spacing=h/6;
  for(let i=0;i<=6;i++){
    ctx.beginPath();ctx.moveTo(0,i*spacing);ctx.lineTo(w,i*spacing);ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,0.20)';
  [0.1,0.3,0.5,0.7,0.9].forEach(x=>{
    ctx.beginPath();ctx.moveTo(w*x,0);ctx.lineTo(w*x,h);ctx.stroke();
  });
  // High school hashes: 1/3 of field width from each sideline
  const hL=w*0.333, hR=w*0.667;
  // Vertical dashed lines marking hash zones
  ctx.strokeStyle='rgba(255,255,255,0.15)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,6]);
  ctx.beginPath();ctx.moveTo(hL,0);ctx.lineTo(hL,h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(hR,0);ctx.lineTo(hR,h);ctx.stroke();
  ctx.setLineDash([]);
  // Perpendicular tick marks crossing each yard line at the hash position
  ctx.strokeStyle='rgba(255,255,255,0.70)';
  ctx.lineWidth=1.5;
  for(let i=0;i<=6;i++){
    const y=i*spacing;
    ctx.beginPath();ctx.moveTo(hL,y-9);ctx.lineTo(hL,y+9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hR,y-9);ctx.lineTo(hR,y+9);ctx.stroke();
  }
  const los=h*0.62;
  ctx.strokeStyle='rgba(240,165,0,0.55)';
  ctx.lineWidth=1;
  ctx.setLineDash([10,5]);
  ctx.beginPath();ctx.moveTo(0,los);ctx.lineTo(w,los);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(240,165,0,0.5)';
  ctx.font='bold 10px sans-serif';
  ctx.fillText('LINE OF SCRIMMAGE',8,los-5);
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.fillRect(0,0,w,los);
  ctx.fillStyle='rgba(240,165,0,0.07)';
  ctx.fillRect(0,los,w,h-los);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.font='bold 13px sans-serif';
  ctx.fillText('DEFENSE',8,20);
  ctx.fillStyle='rgba(34,197,94,0.25)';
  ctx.fillText('OFFENSE',8,h-10);

}

function redrawAll(){
  if(!cvCtx) return;
  const canvas=document.getElementById('playCanvas');
  const dpr=window.devicePixelRatio||1;
  const cw=canvas.width/dpr, ch=canvas.height/dpr;
  const los=ch*0.62;
  cvCtx.clearRect(0,0,cw,ch);
  drawField(cvCtx,cw,ch);
  if(window._cvDefCall) drawCoverageZones(cvCtx,cw,ch,los,window._cvDefCall.coverage);
  if(cvRouteCanvas) cvCtx.drawImage(cvRouteCanvas,0,0,cw,ch);
  cvPlayers.forEach(p=>drawPlayerSymbol(cvCtx,p));
  if(window._cvDefCall){
    drawRushArrows(cvCtx, identifyRushers(window._cvDefCall.blitz||''));
  }
}

function drawCoverageZones(ctx,cw,ch,los,coverage){
  if(!coverage) return;
  const cov=coverage.toUpperCase();
  const deepBase=Math.max(los-100,8);
  const undBase=deepBase;
  const undTop=los-8;
  ctx.save();
  ctx.textAlign='center';

  const str=window._cvStrength||'right';
  const sLabel=`Strong ${str==='right'?'Right':'Left'}`;
  const wLabel=`Weak ${str==='right'?'Left':'Right'}`;

  if(/COVER.?3|TRIPS.BRACKET/.test(cov)){
    const thirds=str==='right'?[
      {x1:0,       x2:cw*0.33, label:`Weak CB — ${wLabel} ⅓`},
      {x1:cw*0.33, x2:cw*0.67, label:'FS — Middle ⅓'},
      {x1:cw*0.67, x2:cw,      label:`Strong CB — ${sLabel} ⅓`},
    ]:[
      {x1:0,       x2:cw*0.33, label:`Strong CB — ${sLabel} ⅓`},
      {x1:cw*0.33, x2:cw*0.67, label:'FS — Middle ⅓'},
      {x1:cw*0.67, x2:cw,      label:`Weak CB — ${wLabel} ⅓`},
    ];
    thirds.forEach((z,i)=>{
      ctx.fillStyle='rgba(96,165,250,0.10)';
      ctx.fillRect(z.x1,8,z.x2-z.x1,deepBase-8);
      if(i>0){
        ctx.strokeStyle='rgba(96,165,250,0.25)';
        ctx.lineWidth=1; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(z.x1,8); ctx.lineTo(z.x1,deepBase); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle='rgba(96,165,250,0.6)';
      ctx.font='bold 10px -apple-system,sans-serif';
      ctx.fillText(z.label,(z.x1+z.x2)/2, 22);
    });
    const blitz=(window._cvDefCall?.blitz||'').toUpperCase();
    const weakBlitz=/WEAK|EDGE|BOUNDARY|WILL|OLB/.test(blitz)&&/BLITZ|PRESSURE|FIRE/.test(blitz);
    const strongBlitz=/STRONG|SAM/.test(blitz)&&/BLITZ|PRESSURE|FIRE/.test(blitz);
    const mlbBlitz=/MIKE|MLB|A.GAP|DOUBLE/.test(blitz)&&/BLITZ|PRESSURE|FIRE/.test(blitz);
    let wFlat = weakBlitz   ? `${wLabel} Flat (NB/CB rotates)` : `${wLabel} Flat — Will LB`;
    let wHook = (weakBlitz||mlbBlitz) ? 'MLB — Expand Hook' : 'Hook — Will LB';
    let sHook = (strongBlitz||mlbBlitz) ? 'MLB — Expand Hook' : 'Hook — Sam LB';
    let sFlat = strongBlitz ? `${sLabel} Flat (NB/CB rotates)` : `${sLabel} Flat — SS`;
    const und=str==='right'?[
      {x1:0,       x2:cw*0.22, label:wFlat,  alert:weakBlitz},
      {x1:cw*0.22, x2:cw*0.48, label:wHook,  alert:weakBlitz||mlbBlitz},
      {x1:cw*0.48, x2:cw*0.78, label:sHook,  alert:strongBlitz||mlbBlitz},
      {x1:cw*0.78, x2:cw,      label:sFlat,  alert:strongBlitz},
    ]:[
      {x1:0,       x2:cw*0.22, label:sFlat,  alert:strongBlitz},
      {x1:cw*0.22, x2:cw*0.48, label:sHook,  alert:strongBlitz||mlbBlitz},
      {x1:cw*0.48, x2:cw*0.78, label:wHook,  alert:weakBlitz||mlbBlitz},
      {x1:cw*0.78, x2:cw,      label:wFlat,  alert:weakBlitz},
    ];
    und.forEach(z=>{
      ctx.fillStyle=z.alert?'rgba(245,158,11,0.12)':'rgba(34,197,94,0.09)';
      ctx.fillRect(z.x1,undBase,z.x2-z.x1,undTop-undBase);
      ctx.fillStyle=z.alert?'rgba(245,158,11,0.75)':'rgba(34,197,94,0.55)';
      ctx.font=z.alert?'bold 8px -apple-system,sans-serif':'8px -apple-system,sans-serif';
      const mid=(undBase+undTop)/2;
      const parts=z.label.split(' — ');
      if(parts.length>1){
        ctx.fillText(parts[0],(z.x1+z.x2)/2,mid);
        ctx.fillText(parts[1],(z.x1+z.x2)/2,mid+11);
      } else {
        ctx.fillText(z.label,(z.x1+z.x2)/2,mid+4);
      }
    });

  } else if(/COVER.?4|QUARTER/.test(cov)){
    const quarters=[
      {x1:0,       x2:cw*0.25, label:'CB — Deep ¼'},
      {x1:cw*0.25, x2:cw*0.50, label:'SS — Deep ¼'},
      {x1:cw*0.50, x2:cw*0.75, label:'FS — Deep ¼'},
      {x1:cw*0.75, x2:cw,      label:'CB — Deep ¼'},
    ];
    quarters.forEach((z,i)=>{
      ctx.fillStyle='rgba(96,165,250,0.10)';
      ctx.fillRect(z.x1,8,z.x2-z.x1,deepBase-8);
      if(i>0){
        ctx.strokeStyle='rgba(96,165,250,0.25)'; ctx.lineWidth=1; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(z.x1,8); ctx.lineTo(z.x1,deepBase); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle='rgba(96,165,250,0.6)';
      ctx.font='bold 10px -apple-system,sans-serif';
      ctx.fillText(z.label,(z.x1+z.x2)/2,22);
    });

  } else if(/COVER.?2/.test(cov)){
    [[0,cw*0.5,'SS — Deep Half'],[cw*0.5,cw,'FS — Deep Half']].forEach((z,i)=>{
      ctx.fillStyle='rgba(96,165,250,0.10)';
      ctx.fillRect(z[0],8,z[1]-z[0],deepBase-8);
      if(i>0){
        ctx.strokeStyle='rgba(96,165,250,0.25)'; ctx.lineWidth=1; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(z[0],8); ctx.lineTo(z[0],deepBase); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle='rgba(96,165,250,0.6)';
      ctx.font='bold 10px -apple-system,sans-serif';
      ctx.fillText(z[2],(z[0]+z[1])/2,22);
    });
    [{x1:0,x2:cw*0.25,lbl:'FLAT'},{x1:cw*0.25,x2:cw*0.5,lbl:'HOOK'},{x1:cw*0.5,x2:cw*0.75,lbl:'HOOK'},{x1:cw*0.75,x2:cw,lbl:'FLAT'}].forEach(z=>{
      ctx.fillStyle='rgba(34,197,94,0.09)';
      ctx.fillRect(z.x1,undBase,z.x2-z.x1,undTop-undBase);
      ctx.fillStyle='rgba(34,197,94,0.55)'; ctx.font='9px -apple-system,sans-serif';
      ctx.fillText(z.lbl,(z.x1+z.x2)/2,(undBase+undTop)/2+4);
    });

  } else if(/COVER.?0|MAN|MAX/.test(cov)){
    ctx.fillStyle='rgba(239,68,68,0.55)';
    ctx.font='bold 11px -apple-system,sans-serif';
    ctx.fillText('MAN COVERAGE — Every Defender Locked',cw/2,22);
  }

  ctx.restore();
}

function drawGapLabels(ctx,cw,los){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 9px -apple-system,sans-serif';
  const cx=cw/2;
  [
    {x:cx,          label:'A'}, {x:cx-cw*0.09,  label:'A'},
    {x:cx+cw*0.145, label:'B'}, {x:cx-cw*0.145, label:'B'},
    {x:cx+cw*0.225, label:'C'}, {x:cx-cw*0.225, label:'C'},
    {x:cx+cw*0.31,  label:'D'}, {x:cx-cw*0.31,  label:'D'},
  ].forEach(g=>{
    ctx.fillStyle='rgba(240,165,0,0.5)';
    ctx.fillText(g.label, g.x, los+11);
  });

  if(window._cvTeDetected){
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.font='bold 9px -apple-system,sans-serif';
    const txt='TE DETECTED — gaps adjusted';
    const tw=ctx.measureText(txt).width;
    ctx.fillStyle='rgba(240,165,0,0.18)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cw-tw-20,4,tw+14,16,4);
    else ctx.rect(cw-tw-20,4,tw+14,16);
    ctx.fill();
    ctx.strokeStyle='rgba(240,165,0,0.55)';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.fillStyle='rgba(240,165,0,0.95)';
    ctx.fillText(txt, cw-8, 6);
  }

  const gapWarns=getGapWarnings(window._cvGapMap||new Map());
  if(gapWarns.length){
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.font='bold 9px -apple-system,sans-serif';
    gapWarns.forEach((w,i)=>{
      const txt=`⚠ ${w}`;
      const tw=ctx.measureText(txt).width;
      ctx.fillStyle='rgba(239,68,68,0.2)';
      ctx.fillRect(4, 4+i*14, tw+10, 13);
      ctx.fillStyle='#ef4444';
      ctx.fillText(txt, 8, 5+i*14);
    });
  }

  ctx.restore();
}

function drawPlayerSymbol(ctx,p){
  const r=p.team==='def'?CV_R-4:CV_R;
  ctx.save();
  ctx.font=`bold ${p.team==='def'?7:8}px -apple-system,Helvetica,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';

  if(cvSelectedPlayer===p||cvDragging===p){
    ctx.beginPath();
    ctx.arc(p.x,p.y,r+6,0,Math.PI*2);
    ctx.strokeStyle='#f0a500';
    ctx.lineWidth=2.5;
    ctx.setLineDash(cvDragging===p?[5,3]:[]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if(p.team==='off'){
    ctx.beginPath();
    if(p.type==='C'){
      ctx.rect(p.x-r,p.y-r,r*2,r*2);
    } else {
      ctx.arc(p.x,p.y,r,0,Math.PI*2);
    }
    ctx.fillStyle='rgba(34,197,94,0.90)';
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.4)';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle='#ffffff';
    ctx.fillText(p.type,p.x,p.y+0.5);
  } else {
    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,10,28,0.92)';
    ctx.fill();
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle='#ffffff';
    ctx.fillText(p.type,p.x,p.y+0.5);
  }
  ctx.restore();
}

function playerAt(x,y){
  for(let i=cvPlayers.length-1;i>=0;i--){
    const p=cvPlayers[i];
    if((x-p.x)**2+(y-p.y)**2<=(CV_R+6)**2) return p;
  }
  return null;
}

function getOLAnchors(){
  const canvas=document.getElementById('playCanvas');
  const dpr=window.devicePixelRatio||1;
  const olAll=cvPlayers.filter(p=>p.team==='off'&&(p.type==='OL'||p.type==='C'));
  if(olAll.length<3) return null;
  const sorted=[...olAll].sort((a,b)=>a.x-b.x);
  const center=sorted.find(p=>p.type==='C')||sorted[Math.floor(sorted.length/2)];
  if(!center) return null;
  const cx=center.x, losY=center.y;
  const leftOL=sorted.filter(p=>p.x<cx-5).sort((a,b)=>b.x-a.x);
  const rightOL=sorted.filter(p=>p.x>cx+5).sort((a,b)=>a.x-b.x);
  const lgx=leftOL[0]?.x??(cx-32);
  const ltx=leftOL[1]?.x??(cx-64);
  const rgx=rightOL[0]?.x??(cx+32);
  const rtx=rightOL[1]?.x??(cx+64);
  const sp=Math.abs((rtx-ltx)/4);
  const te=cvPlayers.find(p=>p.team==='off'&&p.type==='TE'&&Math.abs(p.y-losY)<40);
  return{cx,lgx,ltx,rgx,rtx,tex:te?te.x:null,sp,losY};
}

function defXFromOL(presetName,pdIndex,anchors,strength){
  const{cx,lgx,ltx,rgx,rtx,tex,sp}=anchors;
  const isRight=strength!=='left';
  const stx=isRight?rtx:ltx;   // strong tackle x
  const wtx=isRight?ltx:rtx;   // weak tackle x
  const sgx=isRight?rgx:lgx;   // strong guard x
  const wgx=isRight?lgx:rgx;   // weak guard x
  const ss=isRight?1:-1;        // +1 = strong is rightward, -1 = leftward
  const sw=-ss;
  const teX=(tex!==null&&((isRight&&tex>cx)||(!isRight&&tex<cx)))?tex:null;
  const aGapS=(cx+sgx)/2;
  const aGapW=(wgx+cx)/2;
  const bGapS=(sgx+stx)/2;
  const bGapW=(wgx+wtx)/2;
  const cGapS=teX!==null?(stx+teX)/2:stx+ss*sp*0.8;
  const cGapW=wtx+sw*sp*0.8;
  const edgeS=teX!==null?teX+ss*sp*0.8:stx+ss*sp*1.5;
  const edgeW=wtx+sw*sp*1.5;
  let x=null;
  if(presetName==='4-3'){
    // [0]DE-weak [1]DT-1tech [2]DT-3tech [3]DE-strong [4]Will [5]MLB [6]Sam
    const pos=[cGapW, cx+sw*sp*0.3, bGapS, cGapS, bGapW, cx, stx+ss*sp*0.4];
    if(pdIndex<pos.length) x=pos[pdIndex];
  } else if(presetName==='3-4'){
    // [0]DE-weak [1]NT [2]DE-strong [3]OLB-weak [4]ILB-weak [5]ILB-strong [6]OLB-strong
    const pos=[bGapW, cx, bGapS, edgeW, aGapW, aGapS, edgeS];
    if(pdIndex<pos.length) x=pos[pdIndex];
  } else if(presetName==='3-3-5'){
    // [0]DE-weak [1]NT [2]DE-strong [3]LB-weak [4]MLB [5]LB-strong
    const pos=[bGapW, cx, bGapS, cGapW, cx, cGapS];
    if(pdIndex<pos.length) x=pos[pdIndex];
  }
  return x!==null?Math.round(x):null;
}

function placePreset(name){
  if(!cvCtx) return;
  const canvas=document.getElementById('playCanvas');
  const dpr=window.devicePixelRatio||1;
  const cw=canvas.width/dpr, ch=canvas.height/dpr;
  const los=ch*0.62;
  const custom=(DB.customPresets||[]).find(cp=>cp.id===name);
  const preset=custom?custom.players:CV_PRESETS[name];
  if(!preset) return;
  const team=preset[0].team;
  cvPlayers=cvPlayers.filter(p=>p.team!==team);
  if(team==='def'){
    const anchors=getOLAnchors();
    const strength=getFormationStrength(cw);
    preset.forEach((pd,i)=>{
      const ox=anchors?defXFromOL(name,i,anchors,strength):null;
      const x=ox!==null?ox:Math.round(cw*pd.xf);
      cvPlayers.push({id:++cvPid,type:pd.type,team:pd.team,x,y:Math.round(los+pd.yd)});
    });
    window._cvPresetType=name;
    window._cvStrength=strength;
    // SS to strong side; when OL anchors used LBs are already correct so skip full adjust
    const defNew=cvPlayers.filter(p=>p.team==='def');
    const ssP=defNew.find(p=>p.type==='SS');
    const fsP=defNew.find(p=>p.type==='FS');
    if(ssP) ssP.x=Math.round(cw*(strength==='right'?0.70:0.30));
    if(fsP) fsP.x=Math.round(cw*0.50);
    if(!anchors) adjustDefenseToStrength(strength,cw);
  } else {
    preset.forEach(pd=>{
      cvPlayers.push({id:++cvPid,type:pd.type,team:pd.team,
        x:Math.round(cw*pd.xf),y:Math.round(los+pd.yd)});
    });
  }
  redrawAll();
}

// ── FORMATION STRENGTH ────────────────────────────────────────────────────────
function detectStrengthFromName(formName){
  if(!formName) return null;
  const n=formName.toUpperCase();
  if(/ R(?:\s|$)|RT |RIGHT| STRONG R| TREY R| TRIPS R/.test(n)) return 'right';
  if(/ L(?:\s|$)|LT |LEFT| STRONG L| TREY L| TRIPS L/.test(n)) return 'left';
  if(/TREY|TRIPS/.test(n)){
    if(/ R/.test(n)) return 'right';
    if(/ L/.test(n)) return 'left';
  }
  return null;
}

function detectStrengthFromPlayers(cw){
  const off=cvPlayers.filter(p=>p.team==='off');
  const mid=cw/2;
  const te=off.find(p=>p.type==='TE');
  if(te) return te.x>=mid?'right':'left';
  const rWR=off.filter(p=>p.type==='WR'&&p.x>=mid).length;
  const lWR=off.filter(p=>p.type==='WR'&&p.x<mid).length;
  if(rWR>lWR) return 'right';
  if(lWR>rWR) return 'left';
  const rb=off.find(p=>['RB','HB','FB'].includes(p.type));
  if(rb) return rb.x>=mid?'right':'left';
  return 'right';
}

function getFormationStrength(cw){
  const fromName=detectStrengthFromName(window._cvFormName||'');
  return fromName||detectStrengthFromPlayers(cw);
}

function adjustDefenseToStrength(strength, cw){
  window._cvStrength=strength;
  const def=cvPlayers.filter(p=>p.team==='def');
  const ss=def.find(p=>p.type==='SS');
  const fs=def.find(p=>p.type==='FS');
  const lbs=def.filter(p=>['LB','MLB','OLB'].includes(p.type)).sort((a,b)=>a.x-b.x);
  if(strength==='right'){
    if(ss) ss.x=Math.round(cw*0.70);
    if(fs) fs.x=Math.round(cw*0.50);
  } else {
    if(ss) ss.x=Math.round(cw*0.30);
    if(fs) fs.x=Math.round(cw*0.50);
    if(lbs.length>=2){
      const will=lbs[0], sam=lbs[lbs.length-1];
      if(will!==sam){ const tx=will.x; will.x=sam.x; sam.x=tx; }
    }
  }
}

// ── DEFENSIVE ASSIGNMENT ENGINE ───────────────────────────────────────────────
function identifyRushers(blitz){
  const b=(blitz||'').toUpperCase();
  const def=cvPlayers.filter(p=>p.team==='def');
  const DL=def.filter(p=>['DE','DT','NT'].includes(p.type));
  const LBs=def.filter(p=>['LB','MLB','OLB'].includes(p.type)).sort((a,c)=>a.x-c.x);
  const CBs=def.filter(p=>['CB','NB'].includes(p.type)).sort((a,c)=>a.x-c.x);
  const rushers=new Set(DL.map(p=>p.id));
  const isBlitz=/BLITZ|PRESSURE|FIRE|OVERLOAD|DOG/.test(b);
  const isNoBlitz=/NO BLITZ|BASE\s*4/.test(b);
  if(isNoBlitz) return rushers;
  if(/MIKE|MLB|A.?GAP/.test(b)&&isBlitz){
    const mlb=LBs.find(p=>p.type==='MLB')||LBs[Math.floor(LBs.length/2)];
    if(mlb) rushers.add(mlb.id);
  }
  if(/WEAK|WILL|EDGE|BOUNDARY/.test(b)&&isBlitz){
    const str=window._cvStrength||'right';
    const weakLB=str==='right'?LBs[0]:LBs[LBs.length-1];
    if(weakLB) rushers.add(weakLB.id);
  }
  if(/SAM|STRONG.SIDE/.test(b)&&isBlitz){
    const str=window._cvStrength||'right';
    const samLB=str==='right'?LBs[LBs.length-1]:LBs[0];
    if(samLB) rushers.add(samLB.id);
  }
  if(/DOUBLE|DBL|5.MAN|OVERLOAD/.test(b)){
    LBs.forEach(p=>rushers.add(p.id));
  }
  if(/CORNER/.test(b)&&isBlitz){
    const str=window._cvStrength||'right';
    const weakCB=str==='right'?CBs[0]:CBs[CBs.length-1];
    if(weakCB) rushers.add(weakCB.id);
  }
  if(/FIRE.?ZONE/.test(b)){
    const dropDT=DL.find(p=>p.type==='DT');
    if(dropDT) rushers.delete(dropDT.id);
    if(LBs[0]) rushers.add(LBs[0].id);
  }
  if(/COVER.?0|DOG/.test(b)&&isBlitz){
    const mlb=LBs.find(p=>p.type==='MLB')||LBs[Math.floor(LBs.length/2)];
    if(mlb) rushers.add(mlb.id);
  }
  return rushers;
}

function buildWarnings(rushCount, coverCount, coverage){
  const cov=coverage.toUpperCase();
  const warnings=[];
  if(rushCount>=6) warnings.push({cls:'ca-warn-crit',msg:`🚨 ${rushCount} RUSHERS — only ${coverCount} in coverage. Extremely thin — one missed assignment = touchdown.`});
  else if(rushCount>=5) warnings.push({cls:'ca-warn-thin',msg:`⚠ ${rushCount} rushers — ${coverCount} in coverage. Thin coverage. Make sure every receiver is accounted for.`});
  if(/COVER.?0/.test(cov)) warnings.push({cls:'ca-warn-c0',msg:'🚨 COVER 0 — No safety help. Every defender is in man. Maximum risk. One missed tackle = score.'});
  else if(/COVER.?1/.test(cov)&&rushCount>=5) warnings.push({cls:'ca-warn-info',msg:'FS is the only safety. If he misses his assignment the deep middle is open.'});
  return warnings;
}

function drawRushArrows(ctx, rushers){
  if(!rushers||!rushers.size) return;
  const canvas=document.getElementById('playCanvas');
  const cw=canvas.width/(window.devicePixelRatio||1);
  cvPlayers.filter(p=>p.team==='def'&&rushers.has(p.id)).forEach(p=>{
    ctx.save();
    const isEdge=['DE','OLB'].includes(p.type);
    const dx=isEdge?(p.x>cw/2?-14:14):0;
    const arrowLen=24;
    const sx=p.x, sy=p.y+CV_R+2;
    const ex=p.x+dx, ey=sy+arrowLen;
    ctx.strokeStyle='#ef4444'; ctx.fillStyle='#ef4444';
    ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    const angle=Math.atan2(ey-sy,ex-sx);
    const hl=9;
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex-hl*Math.cos(angle-0.45),ey-hl*Math.sin(angle-0.45));
    ctx.lineTo(ex-hl*Math.cos(angle+0.45),ey-hl*Math.sin(angle+0.45));
    ctx.closePath(); ctx.fill();
    ctx.font='bold 7px -apple-system,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle='#ef4444';
    ctx.fillText('RUSH',p.x,p.y-CV_R-3);
    ctx.restore();
  });
}

// ── TE DETECTION & GAP ASSIGNMENTS ───────────────────────────────────────────
function detectTE(){
  const n=(window._cvFormName||'').toUpperCase();
  return /\bTE\b|\bWING\b|\bKING\b|\bPRO\b|\bI.?FORM\b|\bTIGHT/.test(n);
}

function computeGapAssignments(){
  const preset=window._cvPresetType;
  const gap=new Map();
  if(!preset||!['4-3','3-4','3-3-5'].includes(preset)) return gap;
  const str=window._cvStrength||'right';
  const te=detectTE();
  window._cvTeDetected=(te&&preset==='3-4');
  const def=cvPlayers.filter(p=>p.team==='def');
  const DEs=def.filter(p=>p.type==='DE').sort((a,b)=>a.x-b.x);
  const DTs=def.filter(p=>p.type==='DT').sort((a,b)=>a.x-b.x);
  const NTs=def.filter(p=>p.type==='NT');
  const LBs=def.filter(p=>['LB','MLB','OLB'].includes(p.type)).sort((a,b)=>a.x-b.x);
  const sDE=str==='right'?DEs[DEs.length-1]:DEs[0];
  const wDE=str==='right'?DEs[0]:DEs[DEs.length-1];

  if(preset==='4-3'){
    if(sDE) gap.set(sDE.id,'C-cnt');
    if(wDE&&wDE!==sDE) gap.set(wDE.id,'C-cnt');
    const sDT=DTs.length>=2?(str==='right'?DTs[DTs.length-1]:DTs[0]):null;
    const wDT=DTs.length>=2?(str==='right'?DTs[0]:DTs[DTs.length-1]):DTs[0];
    if(sDT) gap.set(sDT.id,'B');
    if(wDT&&wDT!==sDT) gap.set(wDT.id,'A');
    const mlb=LBs.find(p=>p.type==='MLB')||LBs[Math.floor(LBs.length/2)];
    if(mlb) gap.set(mlb.id,'A');
    const rest=LBs.filter(p=>p!==mlb);
    const sLB=rest.length?(str==='right'?rest[rest.length-1]:rest[0]):null;
    const wLB=rest.length?(str==='right'?rest[0]:rest[rest.length-1]):null;
    if(sLB) gap.set(sLB.id,'B-frc');
    if(wLB&&wLB!==sLB) gap.set(wLB.id,'B-flt');

  } else if(preset==='3-4'){
    NTs.forEach(p=>gap.set(p.id,'A'));
    if(sDE) gap.set(sDE.id,window._cvTeDetected?'C':'B');
    if(wDE&&wDE!==sDE) gap.set(wDE.id,'B');
    if(LBs.length>=4){
      const sOLB=str==='right'?LBs[LBs.length-1]:LBs[0];
      const wOLB=str==='right'?LBs[0]:LBs[LBs.length-1];
      const mid=LBs.slice(1,LBs.length-1);
      const sILB=mid.length?(str==='right'?mid[mid.length-1]:mid[0]):null;
      const wILB=mid.length?(str==='right'?mid[0]:mid[mid.length-1]):null;
      if(sOLB) gap.set(sOLB.id,window._cvTeDetected?'D-edge':'C-edge');
      if(wOLB&&wOLB!==sOLB) gap.set(wOLB.id,'C-edge');
      if(sILB) gap.set(sILB.id,'B-flow');
      if(wILB&&wILB!==sILB) gap.set(wILB.id,'A');
    } else if(LBs.length===3){
      const sOLB=str==='right'?LBs[LBs.length-1]:LBs[0];
      const wOLB=str==='right'?LBs[0]:LBs[LBs.length-1];
      const midLB=LBs[1];
      if(sOLB) gap.set(sOLB.id,window._cvTeDetected?'D-edge':'C-edge');
      if(wOLB&&wOLB!==sOLB) gap.set(wOLB.id,'C-edge');
      if(midLB&&midLB!==sOLB&&midLB!==wOLB) gap.set(midLB.id,'A');
    }

  } else if(preset==='3-3-5'){
    NTs.forEach(p=>gap.set(p.id,'A/A'));
    if(sDE) gap.set(sDE.id,'B-4i');
    if(wDE&&wDE!==sDE) gap.set(wDE.id,'B-4i');
    const mlb=LBs.find(p=>p.type==='MLB')||LBs[Math.floor(LBs.length/2)];
    if(mlb) gap.set(mlb.id,'A-flow');
    const rest=LBs.filter(p=>p!==mlb);
    const sOLB=rest.length?(str==='right'?rest[rest.length-1]:rest[0]):null;
    const wOLB=rest.length?(str==='right'?rest[0]:rest[rest.length-1]):null;
    if(sOLB) gap.set(sOLB.id,'C-edge');
    if(wOLB&&wOLB!==sOLB) gap.set(wOLB.id,'C-edge');
  }

  return gap;
}

function getGapWarnings(gapMap){
  if(!window._cvPresetType||!['4-3','3-4','3-3-5'].includes(window._cvPresetType)) return [];
  if(!gapMap||!gapMap.size) return [];
  const labels=[...gapMap.values()];
  const w=[];
  if(!labels.some(l=>/^A/.test(l))) w.push('GAP A UNCOVERED');
  if(!labels.some(l=>/^B/.test(l))) w.push('GAP B UNCOVERED');
  if(!labels.some(l=>/^C/.test(l))) w.push('GAP C UNCOVERED');
  if(window._cvTeDetected&&!labels.some(l=>/^D/.test(l))) w.push('D GAP (TE EDGE) UNCOVERED');
  return w;
}

// ── OPEN / CLOSE / CLEAR / SAVE ───────────────────────────────────────────────
function openCanvas(onReady){
  const canvas=document.getElementById('playCanvas');
  const dpr=window.devicePixelRatio||1;
  document.getElementById('canvasOv').classList.add('open');
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{
    const wrap=document.querySelector('.canvas-wrap');
    const cw=Math.min(window.innerWidth,640);
    const ch=Math.max(200, wrap?.clientHeight||window.innerHeight-104);
    CV_R=10;
    canvas.width=cw*dpr; canvas.height=ch*dpr;
    canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
    cvCtx=canvas.getContext('2d');
    cvCtx.scale(dpr,dpr);

    cvRouteCanvas=document.createElement('canvas');
    cvRouteCanvas.width=cw*dpr; cvRouteCanvas.height=ch*dpr;
    cvRouteUndoStack=[];
    const rCtx=cvRouteCanvas.getContext('2d');
    rCtx.scale(dpr,dpr);

    const t = cvEditingId ? DB.templates.find(t=>t.id===cvEditingId) : null;
    cvPlayers = (t?.cvPlayers||[]).map(p=>({...p}));
    window._cvPresetType = t?.cvPresetType||null;

    const routeSrc = t?.cvRoutes;
    if(routeSrc){
      const img=new Image();
      img.onload=()=>{ rCtx.drawImage(img,0,0,cw,ch); redrawAll(); };
      img.src=routeSrc;
    } else {
      redrawAll();
    }

    setCanvasMode('place',document.getElementById('modePlaceBtn'));
    if(onReady) onReady(cw,ch);
  });
}

function closeCanvas(){
  document.getElementById('canvasOv').classList.remove('open');
  document.getElementById('cvDefCall').classList.remove('show');
  document.getElementById('canvasSubTitle').textContent='New Template';
  const ap=document.getElementById('cvAssignPanel');
  ap.classList.remove('show');
  const ab=document.getElementById('cvAssignBody');
  if(ab){ ab.innerHTML=''; ab.classList.remove('collapsed'); }
  const atb=document.getElementById('assignToggleBtn');
  if(atb) atb.innerHTML='&#9660;';
  cvSelectedPlayer=null; hidePlayerDeleteBtn();
  window._cvDefCall=null; window._cvStrength=null;
  window._cvFormName=null; window._cvPresetType=null;
  window._cvTeDetected=false; window._cvGapMap=null;
  cvEditingId=null;
  document.body.style.overflow='';
}

function flipCanvas(){
  if(!cvCtx) return;
  const canvas=document.getElementById('playCanvas');
  const dpr=window.devicePixelRatio||1;
  const cw=canvas.width/dpr;
  cvPlayers.forEach(p=>{ p.x=Math.round(cw-p.x); });
  if(cvRouteCanvas){
    const snap=document.createElement('canvas');
    snap.width=cvRouteCanvas.width; snap.height=cvRouteCanvas.height;
    snap.getContext('2d').drawImage(cvRouteCanvas,0,0);
    const rCtx=cvRouteCanvas.getContext('2d');
    rCtx.clearRect(0,0,cvRouteCanvas.width,cvRouteCanvas.height);
    rCtx.save();
    rCtx.translate(cvRouteCanvas.width,0);
    rCtx.scale(-1,1);
    rCtx.drawImage(snap,0,0);
    rCtx.restore();
  }
  redrawAll();
}

function clearCanvas(){
  if(!cvCtx) return;
  cvPlayers=[];
  cvSelectedSymbol=null;
  cvSelectedPlayer=null; hidePlayerDeleteBtn();
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('selected'));
  if(cvRouteCanvas){
    const rCtx=cvRouteCanvas.getContext('2d');
    rCtx.clearRect(0,0,cvRouteCanvas.width,cvRouteCanvas.height);
  }
  window._cvPresetType=null; window._cvStrength=null; window._cvTeDetected=false;
  redrawAll();
}

function saveCanvas(){
  if(!cvCtx) return;
  redrawAll();
  const canvas=document.getElementById('playCanvas');

  // Build thumbnail
  const thumbW=320, thumbH=Math.round(canvas.height/(window.devicePixelRatio||1)/(canvas.width/(window.devicePixelRatio||1))*thumbW);
  const thumb=document.createElement('canvas');
  thumb.width=thumbW; thumb.height=thumbH||180;
  thumb.getContext('2d').drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, thumbW, thumb.height);
  const thumbnailData=thumb.toDataURL('image/jpeg',0.7);
  const routesData=cvRouteCanvas?cvRouteCanvas.toDataURL('image/png'):null;
  const playersData=JSON.parse(JSON.stringify(cvPlayers));
  const presetData=window._cvPresetType||null;

  if(cvEditingId){
    const t=DB.templates.find(t=>t.id===cvEditingId);
    if(t){
      t.cvPlayers=playersData;
      t.cvRoutes=routesData;
      t.cvPresetType=presetData;
      t.thumbnail=thumbnailData;
      saveDB();
    }
    closeCanvas();
    renderLibrary();
    showToast('Saved');
  } else {
    window._pendingSave={ cvPlayers:playersData, cvRoutes:routesData, cvPresetType:presetData, thumbnail:thumbnailData };
    document.getElementById('tmplNameIn').value='';
    document.getElementById('tmplNotesIn').value='';
    document.getElementById('tmplNameIn').classList.remove('err');
    openModal('mSaveTemplate');
  }
}

function toggleCanvasTools(){
  const body=document.getElementById('toolbarBody');
  const btn=document.getElementById('toolCollapseBtn');
  const collapsed=body.classList.toggle('collapsed');
  btn.innerHTML=collapsed?'&#8963;':'&#8964;';
}

function resizeCanvas(){
  if(!cvCtx) return;
  const canvas=document.getElementById('playCanvas');
  const wrap=document.querySelector('.canvas-wrap');
  const dpr=window.devicePixelRatio||1;
  const cw=Math.min(window.innerWidth,640);
  const ch=Math.max(200, wrap?.clientHeight||window.innerHeight-104);
  let routeSnap=null;
  if(cvRouteCanvas&&cvRouteCanvas.width>0){
    routeSnap=document.createElement('canvas');
    routeSnap.width=cvRouteCanvas.width; routeSnap.height=cvRouteCanvas.height;
    routeSnap.getContext('2d').drawImage(cvRouteCanvas,0,0);
  }
  canvas.width=cw*dpr; canvas.height=ch*dpr;
  canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
  cvCtx=canvas.getContext('2d');
  cvCtx.scale(dpr,dpr);
  if(cvRouteCanvas){
    cvRouteCanvas.width=cw*dpr; cvRouteCanvas.height=ch*dpr;
    const rCtx=cvRouteCanvas.getContext('2d');
    rCtx.scale(dpr,dpr);
    if(routeSnap) rCtx.drawImage(routeSnap,0,0,cw,ch);
  }
  redrawAll();
}

function setDrawColor(c,btn){
  cvColor=c;
  document.querySelectorAll('.clr-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function setDrawTool(t,btn){
  cvTool=t;
  document.querySelectorAll('.ctool-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(cvMode==='draw') document.getElementById('playCanvas').style.cursor=t==='erase'?'cell':'crosshair';
}
function setDrawWidth(w,btn){
  cvWidth=w;
  document.querySelectorAll('.cw-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function undoRoute(){
  if(!cvRouteCanvas||cvRouteUndoStack.length===0) return;
  const snap=cvRouteUndoStack.pop();
  const rCtx=cvRouteCanvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const cw=cvRouteCanvas.width/dpr, ch=cvRouteCanvas.height/dpr;
  rCtx.clearRect(0,0,cvRouteCanvas.width,cvRouteCanvas.height);
  rCtx.drawImage(snap,0,0,cw,ch);
  redrawAll();
}

// ── POINTER HANDLERS ──────────────────────────────────────────────────────────
function cvGetPos(e){
  const canvas=document.getElementById('playCanvas');
  const rect=canvas.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  return{ x:src.clientX-rect.left, y:src.clientY-rect.top };
}

function showPlayerDeleteBtn(player){
  const btn=document.getElementById('cvDeletePlayerBtn');
  btn.style.display='block';
  _posDeleteBtn(player);
}
function _posDeleteBtn(player){
  const canvas=document.getElementById('playCanvas');
  const rect=canvas.getBoundingClientRect();
  const btn=document.getElementById('cvDeletePlayerBtn');
  const bx=rect.left+player.x;
  const by=rect.top+player.y-CV_R-38;
  btn.style.left=Math.max(rect.left+40,Math.min(rect.right-40,bx))+'px';
  btn.style.top=Math.max(rect.top+4,by)+'px';
}
function hidePlayerDeleteBtn(){
  document.getElementById('cvDeletePlayerBtn').style.display='none';
}
function deleteSelectedPlayer(){
  if(!cvSelectedPlayer) return;
  cvPlayers=cvPlayers.filter(p=>p!==cvSelectedPlayer);
  cvSelectedPlayer=null;
  hidePlayerDeleteBtn();
  redrawAll();
}

function cvStart(e){
  e.preventDefault();
  const p=cvGetPos(e);
  if(cvMode==='place'){
    const hit=playerAt(p.x,p.y);
    if(hit){
      cvSelectedPlayer=hit;
      cvDragging=hit;
      cvDragOffX=p.x-hit.x; cvDragOffY=p.y-hit.y;
      showPlayerDeleteBtn(hit);
      redrawAll();
    } else {
      cvSelectedPlayer=null;
      hidePlayerDeleteBtn();
      if(cvSelectedSymbol){
        cvPlayers.push({id:++cvPid,...cvSelectedSymbol,x:p.x,y:p.y});
      }
      redrawAll();
    }
    return;
  }
  if(!cvRouteCanvas) return;
  cvDrawing=true; cvLX=p.x; cvLY=p.y;
  // snapshot before stroke for undo
  const snap=document.createElement('canvas');
  snap.width=cvRouteCanvas.width; snap.height=cvRouteCanvas.height;
  snap.getContext('2d').drawImage(cvRouteCanvas,0,0);
  cvRouteUndoStack.push(snap);
  if(cvRouteUndoStack.length>30) cvRouteUndoStack.shift();
  const rCtx=cvRouteCanvas.getContext('2d');
  if(cvTool==='erase'){
    rCtx.save();
    rCtx.globalCompositeOperation='destination-out';
    rCtx.beginPath(); rCtx.arc(p.x,p.y,cvWidth*2.5,0,Math.PI*2);
    rCtx.fillStyle='rgba(0,0,0,1)'; rCtx.fill();
    rCtx.restore();
  } else {
    rCtx.beginPath(); rCtx.arc(p.x,p.y,cvWidth/2,0,Math.PI*2);
    rCtx.fillStyle=cvColor; rCtx.fill();
  }
  redrawAll();
}

function cvMove(e){
  e.preventDefault();
  const p=cvGetPos(e);
  if(cvMode==='place'&&cvDragging){
    cvDragging.x=p.x-cvDragOffX;
    cvDragging.y=p.y-cvDragOffY;
    if(cvSelectedPlayer===cvDragging) _posDeleteBtn(cvDragging);
    redrawAll(); return;
  }
  if(!cvDrawing||!cvRouteCanvas) return;
  const rCtx=cvRouteCanvas.getContext('2d');
  rCtx.save();
  rCtx.beginPath();
  rCtx.moveTo(cvLX,cvLY);
  rCtx.lineTo(p.x,p.y);
  if(cvTool==='erase'){
    rCtx.globalCompositeOperation='destination-out';
    rCtx.strokeStyle='rgba(0,0,0,1)';
    rCtx.lineWidth=cvWidth*4;
  } else {
    rCtx.globalCompositeOperation='source-over';
    rCtx.strokeStyle=cvColor;
    rCtx.lineWidth=cvWidth;
  }
  rCtx.lineCap='round'; rCtx.lineJoin='round';
  rCtx.stroke(); rCtx.restore();
  cvLX=p.x; cvLY=p.y;
  redrawAll();
}

function cvEnd(e){ cvDrawing=false; cvDragging=null; }

(function attachCanvasEvents(){
  const c=document.getElementById('playCanvas');
  if(!c){ console.error('playCanvas not found'); return; }
  c.addEventListener('pointerdown',cvStart,{passive:false});
  c.addEventListener('pointermove',cvMove,{passive:false});
  c.addEventListener('pointerup',cvEnd);
  c.addEventListener('pointercancel',cvEnd);
  c.addEventListener('touchstart', e=>cvStart(e.touches[0]?{...e,clientX:e.touches[0].clientX,clientY:e.touches[0].clientY,preventDefault:()=>e.preventDefault()}:e),{passive:false});
  c.addEventListener('touchmove',  e=>cvMove(e.touches[0]?{...e,clientX:e.touches[0].clientX,clientY:e.touches[0].clientY,preventDefault:()=>e.preventDefault()}:e),{passive:false});
  c.addEventListener('touchend',   cvEnd);
})();

// ── PRINT ─────────────────────────────────────────────────────────────────────
function _ppGapRows(preset, teAdj){
  let rows=[];
  if(preset==='4-3') rows=[
    ['DE (strong)','C','5-tech contain'],['DT (3-tech)','B','strong side'],
    ['DT (1-tech)','A','weak side'],['DE (weak)','C','5-tech contain'],
    ['MLB','A',''],['Sam LB','B','force'],['Will LB','B/Flat',''],
  ];
  else if(preset==='3-4') rows=[
    ['NT','A','strong A'],['DE (strong)',teAdj?'C':'B',teAdj?'TE bumped':''],
    ['DE (weak)','B',''],['OLB (strong)',teAdj?'D':'C',teAdj?'TE bumped':'edge'],
    ['ILB (strong)','B/Flow','hit-and-run'],['ILB (weak)','A','weak A'],
    ['OLB (weak)','C','edge'],
  ];
  else rows=[
    ['NT','A/A','both A gaps'],['DE (strong)','B','4i crash'],
    ['DE (weak)','B','4i crash'],['MLB','A','flow'],
    ['OLB (strong)','C','edge'],['OLB (weak)','C','edge'],
  ];
  return rows.map(([p,g,n])=>
    `<tr><td>${esc(p)}</td><td class="pp-gap-val">${esc(g)}</td><td class="pp-gap-note">${esc(n)}</td></tr>`
  ).join('');
}

  const presetLabel={'4-3':'4-3 BASE','3-4':'3-4 BASE','3-3-5':'3-3-5 STACK'}[preset]||(preset||'');

  document.getElementById('printPage').innerHTML=`
    <style>@page{size:letter landscape;margin:.45in}</style>
    <div class="pp-h">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
        <div><div class="pp-logo">BLITZ<span>IQ</span></div></div>

            <div class="pp-lbl">Coach Notes</div>
            <div class="pp-notes-box"></div>
          </div>

          ${t?.notes?`<div class="pp-lbl" style="margin-top:8px">Template Notes</div>
          <div class="pp-reason">${esc(t.notes)}</div>`:''}
        </div>
      </div>
      <div class="pp-footer">BlitzIQ &nbsp;·&nbsp; Play Diagram Library &nbsp;·&nbsp; richderrik58.github.io/blitzIQ</div>

}

function sharePlayCard(){
  const t=cvEditingId?DB.templates.find(t=>t.id===cvEditingId):null;
  const name=t?.name||'Play Diagram';
  const text=`BlitzIQ — ${name}${t?.notes?'\n'+t.notes:''}`;
  if(navigator.share){
    navigator.share({title:'BlitzIQ — '+name, text}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard'));
  }
}

// ── TOAST ──────────────────────────────────────────────────────────────────────
function showToast(msg, ms=2200){
  const el=document.getElementById('toastEl');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), ms);
}

// ── CUSTOM FORMATION PRESETS ──────────────────────────────────────────────────
function renderCustomPresets(){
  const el=document.getElementById('customOffPresets');
  if(!el) return;
  el.innerHTML='';
  (DB.customPresets||[]).forEach(cp=>{
    const wrap=document.createElement('span');
    wrap.className='custom-preset-wrap';
    const btn=document.createElement('button');
    btn.className='pbtn-preset';
    btn.style.cssText='background:rgba(240,165,0,.12);border-color:rgba(240,165,0,.5);color:var(--gold)';
    btn.textContent=cp.name;
    btn.onclick=()=>placePreset(cp.id);
    const del=document.createElement('button');
    del.className='custom-preset-del';
    del.innerHTML='&#10005;';
    del.title='Delete this formation';
    del.onclick=(e)=>{ e.stopPropagation(); deleteCustomPreset(cp.id); };
    wrap.appendChild(btn);
    wrap.appendChild(del);
    el.appendChild(wrap);
  });
}
function openSaveFormationModal(){
  const offPlayers=cvPlayers.filter(p=>p.team==='off');
  if(offPlayers.length===0){ showToast('Place some offensive players first'); return; }
  const inp=document.getElementById('formationNameIn');
  inp.value=''; inp.classList.remove('err');
  openModal('mSaveFormation');
}
function confirmSaveFormation(){
  const inp=document.getElementById('formationNameIn');
  const name=inp.value.trim();
  if(!name){ inp.classList.add('err'); return; }
  const canvas=document.getElementById('playCanvas');
  const dpr=window.devicePixelRatio||1;
  const cw=canvas.width/dpr, ch=canvas.height/dpr;
  const los=ch*0.62;
  const players=cvPlayers
    .filter(p=>p.team==='off')
    .map(p=>({type:p.type,team:p.team,xf:Math.round((p.x/cw)*1000)/1000,yd:Math.round(p.y-los)}));
  DB.customPresets.push({id:uid(),name,players});
  saveDB();
  renderCustomPresets();
  closeModal('mSaveFormation');
  showToast('Formation saved');
}
function deleteCustomPreset(id){
  DB.customPresets=(DB.customPresets||[]).filter(cp=>cp.id!==id);
  saveDB();
  renderCustomPresets();
}
